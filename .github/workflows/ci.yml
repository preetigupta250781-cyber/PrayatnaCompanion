name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Doctor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Install Admin dependencies
        run: cd admin && npm ci

      - name: Admin Typecheck
        run: npm run admin:typecheck

      - name: Admin Lint
        run: npm run admin:lint

      - name: Admin Test
        run: npm run admin:test

      - name: Admin Build
        run: npm run admin:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://cgpqcpyfrajzfdezqgnm.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNncHFjcHlmcmFqemZkZXpxZ25tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAxNzc1NTksImV4cCI6MjA1NTc1MzU1OX0.Wq3G_wVqfE4mPj35vjWk1V2_yC8qG0Q6Z1xVb3N6L8w' }}
